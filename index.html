<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Perdesi Film | Senaryo ve Film Yönetim Paneli</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #e50914;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f293d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent-color);
        }

        .admin-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        main {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 10px;
            flex: 1;
        }

        .film-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .film-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        .film-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .film-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .film-poster {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #1a233a;
        }

        @media (min-width: 600px) {
            .film-poster {
                height: 220px;
            }
        }

        .film-card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .film-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .film-card-info p {
            color: var(--text-muted);
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 12px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        input[type="file"].form-control {
            padding: 5px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 70px;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .detail-container {
            display: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-link {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .edit-btn {
            background-color: #1f293d;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .edit-btn:hover {
            border-color: var(--accent-color);
        }

        .detail-header {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .detail-poster {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        @media (min-width: 600px) {
            .detail-poster {
                width: 180px;
                height: 260px;
            }
        }

        .detail-meta-box {
            flex: 1;
            min-width: 220px;
        }

        .detail-title {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .detail-slogan {
            color: var(--accent-color);
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .badge-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: #1f293d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .badge.link-badge {
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .badge.link-badge:hover {
            border-color: var(--accent-color);
            color: white;
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .section-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .crew-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            font-size: 0.85rem;
        }

        .crew-item span {
            color: var(--text-muted);
            display: block;
            font-size: 0.7rem;
        }

        .crew-item a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 15px;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            background: rgba(11, 15, 25, 0.95);
        }

        footer a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zaman Perdesi <span>Film</span></h1>
        <button class="admin-btn" onclick="openModalForAdd()">+ Film Ekle</button>
    </header>

    <main>
        <div id="homeView">
            <h2 style="margin-bottom: 15px; font-size: 1.1rem; border-left: 4px solid var(--accent-color); padding-left: 8px;">Arşivdeki Projeler</h2>
            <div class="film-grid" id="filmGrid"></div>
        </div>

        <div id="detailView" class="detail-container">
            <div class="nav-bar">
                <span class="back-link" onclick="goHome()">&larr; Arşive Geri Dön</span>
                <button class="edit-btn" id="editProjectBtn">✏️ Projeyi Düzenle</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </main>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 1.2rem;">Yeni Film / Senaryo Ekle</h2>
            
            <form id="filmForm" onsubmit="saveFilm(event)">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-group">
                    <label>Film / Senaryo Adı</label>
                    <input type="text" id="fAd" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Slogan</label>
                    <input type="text" id="fSlogan" class="form-control" placeholder="Örn: Zaman durduğunda...">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Tür</label>
                        <input type="text" id="fTur" class="form-control" placeholder="Aksiyon, Dram">
                    </div>
                    <div style="flex:1;">
                        <label>Yapım Yılı</label>
                        <input type="text" id="fYil" class="form-control" placeholder="2030">
                    </div>
                    <div style="flex:1;">
                        <label>Süre</label>
                        <input type="text" id="fSure" class="form-control" placeholder="90 dk">
                    </div>
                </div>
                <div class="form-group">
                    <label>Konu</label>
                    <textarea id="fKonu" class="form-control" placeholder="Filmin genel konusu..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tema</label>
                    <input type="text" id="fTema" class="form-control" placeholder="Hafıza, İhanet...">
                </div>
                
                <h3 style="font-size: 0.95rem; color: var(--accent-color); margin: 12px 0 8px 0;">3 Perde Uzun Akışı</h3>
                <div class="form-group">
                    <label>1. Perde (Serim / Giriş)</label>
                    <textarea id="fPerde1" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>2. Perde (Gelişme / Düğüm)</label>
                    <textarea id="fPerde2" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>3. Perde (Çözüm / Final)</label>
                    <textarea id="fPerde3" class="form-control"></textarea>
                </div>

                <h3 style="font-size: 0.95rem; color: var(--accent-color); margin: 12px 0 8px 0;">Künye Bilgileri</h3>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yönetmen</label><input type="text" id="fYonetmen" class="form-control"></div>
                    <div style="flex:1;"><label>Senarist</label><input type="text" id="fSenarist" class="form-control"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yapımcı</label><input type="text" id="fYapimci" class="form-control"></div>
                    <div style="flex:1;"><label>Yapım Şirketi</label><input type="text" id="fYapimSirketi" class="form-control" placeholder="0-NOKTA YAPIM HOLDİNG"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yapım</label><input type="text" id="fYapim" class="form-control" placeholder="0-NOKTA FİLM"></div>
                    <div style="flex:1;"><label>Ülke</label><input type="text" id="fUlke" class="form-control" placeholder="Türkiye"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Görüntü Yönetmeni</label><input type="text" id="fGoruntu" class="form-control"></div>
                    <div style="flex:1;"><label>Kurgu</label><input type="text" id="fKurgu" class="form-control"></div>
                </div>
                <div class="form-group">
                    <label>Web Sitesi</label>
                    <input type="text" id="fWebSite" class="form-control" placeholder="zamanperdesifilm.com.tr">
                </div>
                <div class="form-group">
                    <label>Oyuncular</label>
                    <input type="text" id="fOyuncular" class="form-control" placeholder="Kuzeyfe Kalafat, Turan Gümüş...">
                </div>

                <div class="form-group">
                    <label>Film Afişi Seç (Değiştirmek istemiyorsanız boş bırakabilirsiniz)</label>
                    <input type="file" id="fAfisDosya" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="submit-btn" id="submitBtnText">Filmi / Senaryoyu Kaydet</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <a href="https://zamanperdesifilm.com.tr" target="_blank">zamanperdesifilm.com.tr</a>. Tüm hakları saklıdır.</p>
    </footer>

    <script>
        let filmler = JSON.parse(localStorage.getItem('zamanPerdesiFilmler')) || [];
        let currentDetailIndex = -1;

        function renderGrid() {
            const grid = document.getElementById('filmGrid');
            grid.innerHTML = '';
            
            if (filmler.length === 0) {
                grid.innerHTML = `<div class="empty-msg" style="grid-column: 1/-1;">Henüz arşivde film veya senaryo bulunmuyor. Sağ üstteki "+ Film Ekle" butonunu kullanarak ilk projenizi ekleyebilirsiniz.</div>`;
                return;
            }

            filmler.forEach((film, index) => {
                grid.innerHTML += `
                    <div class="film-card" onclick="showDetail(${index})">
                        <img src="${film.afis}" class="film-poster" alt="${film.ad}">
                        <div class="film-card-info">
                            <h3>${film.ad}</h3>
                            <p>${film.yil} &bull; ${film.tur}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openModalForAdd() {
            document.getElementById('editIndex').value = -1;
            document.getElementById('modalTitle').innerText = "Yeni Film / Senaryo Ekle";
            document.getElementById('submitBtnText').innerText = "Filmi / Senaryoyu Kaydet";
            document.getElementById('filmForm').reset();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('adminModal').style.display = 'none'; }

        function saveFilm(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const dosyaInput = document.getElementById('fAfisDosya');
            
            function processSave(afisUrl) {
                const yeniFilm = {
                    ad: document.getElementById('fAd').value,
                    slogan: document.getElementById('fSlogan').value,
                    tur: document.getElementById('fTur').value,
                    yil: document.getElementById('fYil').value,
                    sure: document.getElementById('fSure').value,
                    konu: document.getElementById('fKonu').value,
                    tema: document.getElementById('fTema').value,
                    perde1: document.getElementById('fPerde1').value,
                    perde2: document.getElementById('fPerde2').value,
                    perde3: document.getElementById('fPerde3').value,
                    yonetmen: document.getElementById('fYonetmen').value,
                    senarist: document.getElementById('fSenarist').value,
                    yapimci: document.getElementById('fYapimci').value,
                    yapimSirketi: document.getElementById('fYapimSirketi').value,
                    yapim: document.getElementById('fYapim').value,
                    ulke: document.getElementById('fUlke').value,
                    website: document.getElementById('fWebSite').value,
                    goruntu: document.getElementById('fGoruntu').value,
                    kurgu: document.getElementById('fKurgu').value,
                    oyuncular: document.getElementById('fOyuncular').value,
                    afis: afisUrl
                };

                if (editIndex === -1) {
                    filmler.push(yeniFilm);
                } else {
                    filmler[editIndex] = yeniFilm;
                }

                localStorage.setItem('zamanPerdesiFilmler', JSON.stringify(filmler));
                closeModal();
                document.getElementById('filmForm').reset();
                renderGrid();

                if (editIndex !== -1) {
                    showDetail(editIndex);
                }
            }

            if (dosyaInput.files && dosyaInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    processSave(uploadEvent.target.result);
                };
                reader.readAsDataURL(dosyaInput.files[0]);
            } else {
                if (editIndex !== -1) {
                    processSave(filmler[editIndex].afis);
                } else {
                    alert('Lütfen bir afiş seçin.');
                }
            }
        }

        function showDetail(index) {
            currentDetailIndex = index;
            const film = filmler[index];
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';

            document.getElementById('editProjectBtn').onclick = function() {
                openEditModal(index);
            };

            const ulkeBilgisi = film.ulke ? film.ulke : 'Türkiye';
            const yapimBilgisi = film.yapim ? film.yapim : '0-NOKTA FİLM';
            const webAdresi = film.website ? film.website : 'zamanperdesifilm.com.tr';
            const webUrl = webAdresi.startsWith('http') ? webAdresi : 'https://' + webAdresi;

            document.getElementById('detailContent').innerHTML = `
                <div class="detail-header">
                    <img src="${film.afis}" class="detail-poster" alt="${film.ad}">
                    <div class="detail-meta-box">
                        <h2 class="detail-title">${film.ad}</h2>
                        <div class="detail-slogan">"${film.slogan}"</div>
                        <div class="badge-row">
                            <span class="badge">📅 ${film.yil}</span>
                            <span class="badge">⏳ ${film.sure}</span>
                        </div>
                        <div class="badge-row">
                            <span class="badge">🎬 ${film.tur}</span>
                            <span class="badge">🌍 ${ulkeBilgisi}</span>
                            <a href="${webUrl}" target="_blank" class="badge link-badge">🌐 ${webAdresi}</a>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; margin-bottom: 8px;"><b>Konu:</b> ${film.konu}</p>
                        <p style="color: var(--text-muted); font-size: 0.8rem;"><b>Tema:</b> ${film.tema}</p>
                    </div>
                </div>

                <div class="section-box">
                    <h3>3 Perde Uzun Akışı</h3>
                    <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;"><b>1. Perde (Serim):</b> ${film.perde1}</p>
                    <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;"><b>2. Perde (Gelişme):</b> ${film.perde2}</p>
                    <p style="color: var(--text-muted); font-size: 0.9rem;"><b>3. Perde (Çözüm):</b> ${film.perde3}</p>
                </div>

                <div class="section-box">
                    <h3>Künye Kadrosu</h3>
                    <div class="crew-grid">
                        <div class="crew-item"><span>Yönetmen</span><b>${film.yonetmen}</b></div>
                        <div class="crew-item"><span>Senarist</span><b>${film.senarist}</b></div>
                        <div class="crew-item"><span>Yapımcı</span><b>${film.yapimci}</b></div>
                        <div class="crew-item"><span>Yapım</span><b>${yapimBilgisi}</b></div>
                        <div class="crew-item"><span>Yapım Şirketi</span><b>${film.yapimSirketi || '-'}</b></div>
                        <div class="crew-item"><span>Ülke</span><b>${ulkeBilgisi}</b></div>
                        <div class="crew-item"><span>Görüntü Yönetmeni</span><b>${film.goruntu}</b></div>
                        <div class="crew-item"><span>Kurgu</span><b>${film.kurgu}</b></div>
                        <div class="crew-item"><span>Web Sitesi</span><b><a href="${webUrl}" target="_blank">${webAdresi}</a></b></div>
                        <div class="crew-item" style="grid-column: span 2;"><span>Oyuncular</span><b>${film.oyuncular}</b></div>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function openEditModal(index) {
            const film = filmler[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('modalTitle').innerText = "Projeyi Düzenle";
            document.getElementById('submitBtnText').innerText = "Değişiklikleri Güncelle";

            document.getElementById('fAd').value = film.ad || '';
            document.getElementById('fSlogan').value = film.slogan || '';
            document.getElementById('fTur').value = film.tur || '';
            document.getElementById('fYil').value = film.yil || '';
            document.getElementById('fSure').value = film.sure || '';
            document.getElementById('fKonu').value = film.konu || '';
            document.getElementById('fTema').value = film.tema || '';
            document.getElementById('fPerde1').value = film.perde1 || '';
            document.getElementById('fPerde2').value = film.perde2 || '';
            document.getElementById('fPerde3').value = film.perde3 || '';
            document.getElementById('fYonetmen').value = film.yonetmen || '';
            document.getElementById('fSenarist').value = film.senarist || '';
            document.getElementById('fYapimci').value = film.yapimci || '';
            document.getElementById('fYapimSirketi').value = film.yapimSirketi || '';
            document.getElementById('fYapim').value = film.yapim || '';
            document.getElementById('fUlke').value = film.ulke || '';
            document.getElementById('fWebSite').value = film.website || '';
            document.getElementById('fGoruntu').value = film.goruntu || '';
            document.getElementById('fKurgu').value = film.kurgu || '';
            document.getElementById('fOyuncular').value = film.oyuncular || '';
            document.getElementById('fAfisDosya').value = '';

            document.getElementById('adminModal').style.display = 'flex';
        }

        function goHome() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
