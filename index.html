<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Perdesi Film | Senaryo ve Film Yönetim Paneli</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-color: #e50914;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f293d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent-color);
        }

        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .admin-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .user-btn {
            background-color: #1f293d;
            color: white;
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .user-btn:hover {
            border-color: var(--accent-color);
        }

        .logout-btn {
            background-color: #374151;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        main {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 10px;
            flex: 1;
        }

        .film-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .film-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        .film-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .film-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .film-poster {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #1a233a;
        }

        @media (min-width: 600px) {
            .film-poster {
                height: 220px;
            }
        }

        .film-card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .film-card-info h3 {
            font-size: 0.85rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .film-card-info p {
            color: var(--text-muted);
            font-size: 0.7rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 15px;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 12px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted); font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        input[type="file"].form-control {
            padding: 5px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 70px;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .detail-container {
            display: none;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-link {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .edit-btn {
            background-color: #1f293d;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .edit-btn:hover {
            border-color: var(--accent-color);
        }

        .detail-header {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .detail-poster {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        @media (min-width: 600px) {
            .detail-poster {
                width: 180px;
                height: 260px;
            }
        }

        .detail-meta-box {
            flex: 1;
            min-width: 220px;
        }

        .detail-title {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .detail-slogan {
            color: var(--accent-color);
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .badge-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge {
            background: #1f293d;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .badge.link-badge {
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .badge.link-badge:hover {
            border-color: var(--accent-color);
            color: white;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .fav-btn {
            background: #1f293d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .fav-btn.favorited {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .section-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .crew-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            font-size: 0.85rem;
        }

        .crew-item span {
            color: var(--text-muted);
            display: block;
            font-size: 0.7rem;
        }

        .crew-item a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .comment-box {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .comment-box span {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
            margin-bottom: 4px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 15px;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            background: rgba(11, 15, 25, 0.95);
        }

        footer a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zaman Perdesi <span>Film</span></h1>
        <div class="header-btns" id="headerBtnsContainer">
            <button class="user-btn" id="userAuthBtn" onclick="handleUserAuthClick()">👤 Üye Girişi</button>
            <button class="admin-btn" id="mainAdminBtn" onclick="handleAdminClick()" style="display:none;">+ Film Ekle</button>
            <button class="logout-btn" id="adminLogoutBtn" onclick="handleAdminLogout()" style="display:none;">Çıkış</button>
        </div>
    </header>

    <main>
        <div id="homeView">
            <h2 style="margin-bottom: 15px; font-size: 1.1rem; border-left: 4px solid var(--accent-color); padding-left: 8px;">Arşivdeki Projeler</h2>
            <div class="film-grid" id="filmGrid">Yükleniyor...</div>
        </div>

        <div id="detailView" class="detail-container">
            <div class="nav-bar">
                <span class="back-link" onclick="goHome()">&larr; Arşive Geri Dön</span>
                <button class="edit-btn" id="editProjectBtn" style="display:none;" onclick="openEditModalFromDetail()">✏️ Projeyi Düzenle</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </main>

    <!-- Normal Üye Giriş / Kayıt Modalı -->
    <div class="modal" id="userAuthModal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="close-btn" onclick="closeUserAuthModal()">&times;</button>
            <h2 id="authModalTitle" style="margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color);">Üye Girişi</h2>
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="authEmail" class="form-control" placeholder="ornek@email.com">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="authPassword" class="form-control" placeholder="••••••••">
            </div>
            <button type="button" class="submit-btn" id="authSubmitBtn" onclick="submitUserAuth()">Giriş Yap</button>
            <p style="text-align: center; margin-top: 12px; font-size: 0.8rem; color: var(--text-muted);">
                Hesabın yok mu? <span id="authSwitchText" style="color: var(--accent-color); cursor: pointer; font-weight: 600;" onclick="toggleAuthMode()">Kayıt Ol</span>
            </p>
        </div>
    </div>

    <!-- Özel Admin Giriş Modalı -->
    <div class="modal" id="adminLoginModal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="close-btn" onclick="closeAdminLoginModal()">&times;</button>
            <h2 style="margin-bottom: 15px; font-size: 1.2rem; color: var(--accent-color);">🔒 Admin Girişi</h2>
            <div class="form-group">
                <label>Admin E-posta</label>
                <input type="email" id="adminLoginEmail" class="form-control" placeholder="admin@zamanperdesifilm.com.tr">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="adminLoginPassword" class="form-control" placeholder="••••••••">
            </div>
            <button type="button" class="submit-btn" onclick="submitAdminLogin()">Admin Girişi Yap</button>
        </div>
    </div>

    <!-- Film Ekleme / Düzenleme Modalı (Sadece Admin) -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 1.2rem;">Yeni Film / Senaryo Ekle</h2>
            
            <form id="filmForm" onsubmit="saveFilmToFirebase(event)">
                <input type="hidden" id="editDocId" value="">
                <div class="form-group">
                    <label>Film / Senaryo Adı</label>
                    <input type="text" id="fAd" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Slogan</label>
                    <input type="text" id="fSlogan" class="form-control" placeholder="Örn: Zaman durduğunda...">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Tür</label>
                        <input type="text" id="fTur" class="form-control" placeholder="Aksiyon, Dram">
                    </div>
                    <div style="flex:1;">
                        <label>Yapım Yılı</label>
                        <input type="text" id="fYil" class="form-control" placeholder="2030">
                    </div>
                    <div style="flex:1;">
                        <label>Süre</label>
                        <input type="text" id="fSure" class="form-control" placeholder="90 dk">
                    </div>
                </div>
                <div class="form-group">
                    <label>Konu</label>
                    <textarea id="fKonu" class="form-control" placeholder="Filmin genel konusu..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tema</label>
                    <input type="text" id="fTema" class="form-control" placeholder="Hafıza, İhanet...">
                </div>
                
                <h3 style="font-size: 0.95rem; color: var(--accent-color); margin: 12px 0 8px 0;">3 Perde Uzun Akışı</h3>
                <div class="form-group">
                    <label>1. Perde (Serim / Giriş)</label>
                    <textarea id="fPerde1" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>2. Perde (Gelişme / Düğüm)</label>
                    <textarea id="fPerde2" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>3. Perde (Çözüm / Final)</label>
                    <textarea id="fPerde3" class="form-control"></textarea>
                </div>

                <h3 style="font-size: 0.95rem; color: var(--accent-color); margin: 12px 0 8px 0;">Künye Bilgileri</h3>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yönetmen</label><input type="text" id="fYonetmen" class="form-control"></div>
                    <div style="flex:1;"><label>Senarist</label><input type="text" id="fSenarist" class="form-control"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yapımcı</label><input type="text" id="fYapimci" class="form-control"></div>
                    <div style="flex:1;"><label>Yapım Şirketi</label><input type="text" id="fYapimSirketi" class="form-control" placeholder="0-NOKTA YAPIM HOLDİNG"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Yapım</label><input type="text" id="fYapim" class="form-control" placeholder="0-NOKTA FİLM"></div>
                    <div style="flex:1;"><label>Ülke</label><input type="text" id="fUlke" class="form-control" placeholder="Türkiye"></div>
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex:1;"><label>Görüntü Yönetmeni</label><input type="text" id="fGoruntu" class="form-control"></div>
                    <div style="flex:1;"><label>Kurgu</label><input type="text" id="fKurgu" class="form-control"></div>
                </div>
                <div class="form-group">
                    <label>Web Sitesi</label>
                    <input type="text" id="fWebSite" class="form-control" placeholder="zamanperdesifilm.com.tr">
                </div>
                <div class="form-group">
                    <label>Oyuncular</label>
                    <input type="text" id="fOyuncular" class="form-control" placeholder="Kuzeyfe Kalafat, Turan Gümüş...">
                </div>

                <div class="form-group">
                    <label>Film Afişi Seç (Değiştirmek istemiyorsanız boş bırakabilirsiniz)</label>
                    <input type="file" id="fAfisDosya" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="submit-btn" id="submitBtnText">Filmi / Senaryoyu Kaydet</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <a href="https://zamanperdesifilm.com.tr" target="_blank">zamanperdesifilm.com.tr</a>. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Firebase SDK Entegrasyonu -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBqhatIKXnwZu67OS14BdWofFt6yNnWFP0",
            authDomain: "zamanperdesifilm-db723.firebaseapp.com",
            projectId: "zamanperdesifilm-db723",
            storageBucket: "zamanperdesifilm-db723.firebasestorage.app",
            messagingSenderId: "898941371069",
            appId: "1:898941371069:web:bbf45cca7d3ca68ac92dd4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "kuzeyfe198634@gmail.com";

        let filmlerListesi = [];
        let currentUser = null;
        let activeDetailIndex = -1;
        let isRegisterMode = false;
        let userFavorites = [];

        // Oturum Durumu Takibi
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const userBtn = document.getElementById('userAuthBtn');
            const adminBtn = document.getElementById('mainAdminBtn');
            const logoutBtn = document.getElementById('adminLogoutBtn');
            const editBtn = document.getElementById('editProjectBtn');
            
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    userBtn.style.display = 'none';
                    adminBtn.style.display = 'block';
                    logoutBtn.style.display = 'block';
                    if (activeDetailIndex !== -1) editBtn.style.display = 'block';
                } else {
                    userBtn.style.display = 'block';
                    userBtn.innerText = `👤 ${user.email.split('@')[0]} (Çıkış)`;
                    adminBtn.style.display = 'none';
                    logoutBtn.style.display = 'none';
                    editBtn.style.display = 'none';
                }

                await fetchUserFavorites();
                if (activeDetailIndex !== -1) showDetail(activeDetailIndex);
            } else {
                userBtn.style.display = 'block';
                userBtn.innerText = "👤 Üye Girişi";
                adminBtn.style.display = 'block'; // Giriş yapmamışsa admin giriş butonu görünsün
                adminBtn.innerText = "🔒 Admin Girişi";
                logoutBtn.style.display = 'none';
                editBtn.style.display = 'none';
                userFavorites = [];
                if (activeDetailIndex !== -1) showDetail(activeDetailIndex);
            }
        });

        window.handleUserAuthClick = function() {
            if (currentUser && currentUser.email !== ADMIN_EMAIL) {
                if (confirm("Çıkış yapmak istiyor musunuz?")) {
                    signOut(auth).then(() => alert("Çıkış yapıldı."));
                }
            } else {
                document.getElementById('userAuthModal').style.display = 'flex';
            }
        }

        window.closeUserAuthModal = function() {
            document.getElementById('userAuthModal').style.display = 'none';
        }

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authModalTitle');
            const btn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('authSwitchText');

            if (isRegisterMode) {
                title.innerText = "Üye Kayıt Ol";
                btn.innerText = "Kayıt Ol";
                switchText.innerText = "Giriş Yap";
            } else {
                title.innerText = "Üye Girişi";
                btn.innerText = "Giriş Yap";
                switchText.innerText = "Kayıt Ol";
            }
        }

        window.submitUserAuth = async function() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            try {
                if (isRegisterMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Kayıt başarılı ve giriş yapıldı!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("Giriş başarılı!");
                }
                closeUserAuthModal();
            } catch (error) {
                alert("İşlem hatası: " + error.message);
            }
        }

        // Admin Butonu İşleyicisi
        window.handleAdminClick = function() {
            if (currentUser && currentUser.email === ADMIN_EMAIL) {
                // Admin zaten içerideyse doğrudan film ekleme modalını aç
                document.getElementById('editDocId').value = "";
                document.getElementById('modalTitle').innerText = "Yeni Film / Senaryo Ekle";
                document.getElementById('submitBtnText').innerText = "Filmi / Senaryoyu Kaydet";
                document.getElementById('filmForm').reset();
                document.getElementById('adminModal').style.display = 'flex';
            } else {
                // Dışarıdan biri basarsa admin giriş modalını aç
                document.getElementById('adminLoginModal').style.display = 'flex';
            }
        }

        window.handleAdminLogout = function() {
            if (confirm("Admin oturumunu kapatmak istiyor musunuz?")) {
                signOut(auth).then(() => alert("Admin çıkışı yapıldı."));
            }
        }

        window.closeAdminLoginModal = function() {
            document.getElementById('adminLoginModal').style.display = 'none';
        }

        window.submitAdminLogin = async function() {
            const email = document.getElementById('adminLoginEmail').value;
            const password = document.getElementById('adminLoginPassword').value;
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                if (userCredential.user.email !== ADMIN_EMAIL) {
                    await signOut(auth);
                    alert("Bu alan sadece yönetici içindir!");
                    return;
                }
                closeAdminLoginModal();
                alert("Admin girişi başarılı!");
            } catch (error) {
                alert("Admin giriş hatası: " + error.message);
            }
        }

        window.closeModal = function() { 
            document.getElementById('adminModal').style.display = 'none'; 
        }

        async function fetchUserFavorites() {
            if (!currentUser) return;
            try {
                const userDocRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) {
                    userFavorites = docSnap.data().favorites || [];
                } else {
                    userFavorites = [];
                }
            } catch (e) {
                console.error("Favoriler yüklenemedi:", e);
            }
        }

        window.toggleFavorite = async function(filmId) {
            if (!currentUser || currentUser.email === ADMIN_EMAIL) {
                alert("Favorilere eklemek için lütfen normal bir üye hesabı ile giriş yapın!");
                document.getElementById('userAuthModal').style.display = 'flex';
                return;
            }

            const userDocRef = doc(db, "users", currentUser.uid);
            try {
                if (userFavorites.includes(filmId)) {
                    await updateDoc(userDocRef, { favorites: arrayRemove(filmId) });
                    userFavorites = userFavorites.filter(id => id !== filmId);
                    alert("Favorilerden çıkarıldı.");
                } else {
                    await setDoc(userDocRef, { favorites: arrayUnion(filmId) }, { merge: true });
                    userFavorites.push(filmId);
                    alert("Favorilere eklendi! ❤️");
                }
                showDetail(activeDetailIndex);
            } catch (err) {
                await setDoc(userDocRef, { favorites: [filmId] }, { merge: true });
                userFavorites.push(filmId);
                alert("Favorilere eklendi! ❤️");
                showDetail(activeDetailIndex);
            }
        }

        window.addComment = async function(filmId) {
            if (!currentUser) {
                alert("Yorum yapabilmek için lütfen giriş yapın!");
                document.getElementById('userAuthModal').style.display = 'flex';
                return;
            }

            const commentText = document.getElementById('newCommentText').value.trim();
            if (!commentText) {
                alert("Lütfen bir yorum yazın.");
                return;
            }

            const filmRef = doc(db, "films", filmId);
            const newComment = {
                user: currentUser.email,
                text: commentText,
                date: new Date().toLocaleDateString('tr-TR')
            };

            try {
                await updateDoc(filmRef, {
                    comments: arrayUnion(newComment)
                });
                alert("Yorumunuz eklendi!");
                document.getElementById('newCommentText').value = '';
                await fetchFilmsWithoutRender();
                showDetail(activeDetailIndex);
            } catch (err) {
                try {
                    await updateDoc(filmRef, { comments: [newComment] });
                    alert("Yorumunuz eklendi!");
                    document.getElementById('newCommentText').value = '';
                    await fetchFilmsWithoutRender();
                    showDetail(activeDetailIndex);
                } catch (e2) {
                    alert("Yorum eklenirken hata oluştu.");
                }
            }
        }

        async function fetchFilmsWithoutRender() {
            const querySnapshot = await getDocs(collection(db, "films"));
            filmlerListesi = [];
            querySnapshot.forEach((docSnap) => {
                filmlerListesi.push({ id: docSnap.id, ...docSnap.data() });
            });
        }

        async function fetchFilms() {
            const grid = document.getElementById('filmGrid');
            grid.innerHTML = '<div class="empty-msg" style="grid-column: 1/-1;">Arşiv yükleniyor...</div>';
            try {
                await fetchFilmsWithoutRender();
                renderGrid();
            } catch (error) {
                grid.innerHTML = `<div class="empty-msg" style="grid-column: 1/-1;">Veriler yüklenirken hata oluştu: ${error.message}</div>`;
            }
        }

        function renderGrid() {
            const grid = document.getElementById('filmGrid');
            grid.innerHTML = '';
            
            if (filmlerListesi.length === 0) {
                grid.innerHTML = `<div class="empty-msg" style="grid-column: 1/-1;">Henüz arşivde film veya senaryo bulunmuyor.</div>`;
                return;
            }

            filmlerListesi.forEach((film, index) => {
                grid.innerHTML += `
                    <div class="film-card" onclick="showDetail(${index})">
                        <img src="${film.afis || ''}" class="film-poster" alt="${film.ad}">
                        <div class="film-card-info">
                            <h3>${film.ad}</h3>
                            <p>${film.yil || ''} &bull; ${film.tur || ''}</p>
                        </div>
                    </div>
                `;
            });
        }

        window.showDetail = function(index) {
            activeDetailIndex = index;
            const film = filmlerListesi[index];
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';

            if (currentUser && currentUser.email === ADMIN_EMAIL) {
                document.getElementById('editProjectBtn').style.display = 'block';
            }

            const ulkeBilgisi = film.ulke ? film.ulke : 'Türkiye';
            const yapimBilgisi = film.yapim ? film.yapim : '0-NOKTA FİLM';
            const webAdresi = film.website ? film.website : 'zamanperdesifilm.com.tr';
            const webUrl = webAdresi.startsWith('http') ? webAdresi : 'https://' + webAdresi;

            const isFav = userFavorites.includes(film.id);
            const favButtonText = isFav ? "❤️ Favorilerden Çıkar" : "🤍 Favorilere Ekle";
            const favButtonClass = isFav ? "fav-btn favorited" : "fav-btn";

            let commentsHtml = '';
            if (film.comments && film.comments.length > 0) {
                film.comments.forEach(c => {
                    commentsHtml += `
                        <div class="comment-box">
                            <span><b>${c.user}</b> &bull; ${c.date}</span>
                            <p>${c.text}</p>
                        </div>
                    `;
                });
            } else {
                commentsHtml = '<p style="color: var(--text-muted); font-size: 0.85rem;">Bu projeye henüz yorum yapılmamış. İlk yorumu sen yap!</p>';
            }

            document.getElementById('detailContent').innerHTML = `
                <div class="detail-header">
                    <img src="${film.afis || ''}" class="detail-poster" alt="${film.ad}">
                    <div class="detail-meta-box">
                        <h2 class="detail-title">${film.ad}</h2>
                        <div class="detail-slogan">"${film.slogan || ''}"</div>
                        <div class="badge-row">
                            <span class="badge">📅 ${film.yil || ''}</span>
                            <span class="badge">⏳ ${film.sure || ''}</span>
                        </div>
                        <div class="badge-row">
                            <span class="badge">🎬 ${film.tur || ''}</span>
                            <span class="badge">🌍 ${ulkeBilgisi}</span>
                            <a href="${webUrl}" target="_blank" class="badge link-badge">🌐 ${webAdresi}</a>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; margin-bottom: 8px;"><b>Konu:</b> ${film.konu || ''}</p>
                        <p style="color: var(--text-muted); font-size: 0.8rem;"><b>Tema:</b> ${film.tema || ''}</p>
                        
                        <div class="action-row">
                            <button class="${favButtonClass}" onclick="toggleFavorite('${film.id}')">${favButtonText}</button>
                        </div>
                    </div>
                </div>

                <div class="section-box">
                    <h3>3 Perde Uzun Akışı</h3>
                    <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;"><b>1. Perde (Serim):</b> ${film.perde1 || ''}</p>
                    <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;"><b>2. Perde (Gelişme):</b> ${film.perde2 || ''}</p>
                    <p style="color: var(--text-muted); font-size: 0.9rem;"><b>3. Perde (Çözüm):</b> ${film.perde3 || ''}</p>
                </div>

                <div class="section-box">
                    <h3>Künye Kadrosu</h3>
                    <div class="crew-grid">
                        <div class="crew-item"><span>Yönetmen</span><b>${film.yonetmen || ''}</b></div>
                        <div class="crew-item"><span>Senarist</span><b>${film.senarist || ''}</b></div>
                        <div class="crew-item"><span>Yapımcı</span><b>${film.yapimci || ''}</b></div>
                        <div class="crew-item"><span>Yapım</span><b>${yapimBilgisi}</b></div>
                        <div class="crew-item"><span>Yapım Şirketi</span><b>${film.yapimSirketi || '-'}</b></div>
                        <div class="crew-item"><span>Ülke</span><b>${ulkeBilgisi}</b></div>
                        <div class="crew-item"><span>Görüntü Yönetmeni</span><b>${film.goruntu || ''}</b></div>
                        <div class="crew-item"><span>Kurgu</span><b>${film.kurgu || ''}</b></div>
                        <div class="crew-item"><span>Web Sitesi</span><b><a href="${webUrl}" target="_blank">${webAdresi}</a></b></div>
                        <div class="crew-item" style="grid-column: span 2;"><span>Oyuncular</span><b>${film.oyuncular || ''}</b></div>
                    </div>
                </div>

                <div class="section-box">
                    <h3>Yorumlar ve Geri Bildirimler</h3>
                    <div style="margin-bottom: 12px;">
                        ${commentsHtml}
                    </div>
                    <div class="form-group" style="margin-top: 10px;">
                        <textarea id="newCommentText" class="form-control" placeholder="Film hakkında düşüncelerini paylaş..."></textarea>
                        <button type="button" class="submit-btn" style="margin-top: 8px; padding: 7px;" onclick="addComment('${film.id}')">Yorum Yap</button>
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        window.openEditModalFromDetail = function() {
            if (activeDetailIndex === -1 || !currentUser || currentUser.email !== ADMIN_EMAIL) return;
            const film = filmlerListesi[activeDetailIndex];
            document.getElementById('editDocId').value = film.id;
            document.getElementById('modalTitle').innerText = "Projeyi Düzenle";
            document.getElementById('submitBtnText').innerText = "Değişiklikleri Güncelle";

            document.getElementById('fAd').value = film.ad || '';
            document.getElementById('fSlogan').value = film.slogan || '';
            document.getElementById('fTur').value = film.tur || '';
            document.getElementById('fYil').value = film.yil || '';
            document.getElementById('fSure').value = film.sure || '';
            document.getElementById('fKonu').value = film.konu || '';
            document.getElementById('fTema').value = film.tema || '';
            document.getElementById('fPerde1').value = film.perde1 || '';
            document.getElementById('fPerde2').value = film.perde2 || '';
            document.getElementById('fPerde3').value = film.perde3 || '';
            document.getElementById('fYonetmen').value = film.yonetmen || '';
            document.getElementById('fSenarist').value = film.senarist || '';
            document.getElementById('fYapimci').value = film.yapimci || '';
            document.getElementById('fYapimSirketi').value = film.yapimSirketi || '';
            document.getElementById('fYapim').value = film.yapim || '';
            document.getElementById('fUlke').value = film.ulke || '';
            document.getElementById('fWebSite').value = film.website || '';
            document.getElementById('fGoruntu').value = film.goruntu || '';
            document.getElementById('fKurgu').value = film.kurgu || '';
            document.getElementById('fOyuncular').value = film.oyuncular || '';
            document.getElementById('fAfisDosya').value = '';

            document.getElementById('adminModal').style.display = 'flex';
        }

        window.saveFilmToFirebase = async function(e) {
            e.preventDefault();
            if (!currentUser || currentUser.email !== ADMIN_EMAIL) {
                alert("Bu işlem için yetkiniz yok!");
                return;
            }

            const docId = document.getElementById('editDocId').value;
            const dosyaInput = document.getElementById('fAfisDosya');

            async function saveToDb(afisUrl) {
                const filmData = {
                    ad: document.getElementById('fAd').value,
                    slogan: document.getElementById('fSlogan').value,
                    tur: document.getElementById('fTur').value,
                    yil: document.getElementById('fYil').value,
                    sure: document.getElementById('fSure').value,
                    konu: document.getElementById('fKonu').value,
                    tema: document.getElementById('fTema').value,
                    perde1: document.getElementById('fPerde1').value,
                    perde2: document.getElementById('fPerde2').value,
                    perde3: document.getElementById('fPerde3').value,
                    yonetmen: document.getElementById('fYonetmen').value,
                    senarist: document.getElementById('fSenarist').value,
                    yapimci: document.getElementById('fYapimci').value,
                    yapimSirketi: document.getElementById('fYapimSirketi').value,
                    yapim: document.getElementById('fYapim').value,
                    ulke: document.getElementById('fUlke').value,
                    website: document.getElementById('fWebSite').value,
                    goruntu: document.getElementById('fGoruntu').value,
                    kurgu: document.getElementById('fKurgu').value,
                    oyuncular: document.getElementById('fOyuncular').value,
                    afis: afisUrl
                };

                try {
                    if (!docId) {
                        await addDoc(collection(db, "films"), filmData);
                        alert("Film başarıyla eklendi!");
                    } else {
                        await updateDoc(doc(db, "films", docId), filmData);
                        alert("Film güncellendi!");
                    }
                    closeModal();
                    document.getElementById('filmForm').reset();
                    fetchFilms();
                    if(docId && activeDetailIndex !== -1) {
                        setTimeout(() => showDetail(activeDetailIndex), 500);
                    }
                } catch (err) {
                    alert("Kayıt hatası: " + err.message);
                }
            }

            if (dosyaInput.files && dosyaInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveToDb(uploadEvent.target.result);
                };
                reader.readAsDataURL(dosyaInput.files[0]);
            } else {
                if (docId) {
                    const existingFilm = filmlerListesi.find(f => f.id === docId);
                    saveToDb(existingFilm.afis);
                } else {
                    alert('Lütfen bir afiş görseli seçin.');
                }
            }
        }

        window.goHome = function() {
            activeDetailIndex = -1;
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            fetchFilms();
        }

        fetchFilms();
    </script>
</body>
</html>
